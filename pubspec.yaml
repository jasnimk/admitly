name: admitly
description: "School Admission Management Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  dartz: ^0.10.1
  get_it: ^8.0.0
  go_router: ^14.3.0
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  logger: ^2.5.0
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  flutter_native_splash: ^2.4.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F0F2F4"
  color_dark: "#15171F"
  image: assets/logo/logo_light.png
  image_dark: assets/logo/logo_dark.png
  android: true
  ios: true
  android_12:
    image: assets/logo/logo_light.png
    icon_background_color: "#F0F2F4"
    image_dark: assets/logo/logo_dark.png
    icon_background_color_dark: "#15171F"
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/logo/logo_dark.png
    - assets/logo/logo_light.png
    - assets/logo/app_icon.png
    - assets/images/
